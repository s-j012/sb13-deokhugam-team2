spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/deokhugam}
    username: ${DB_USERNAME:deokhugam_user}
    password: ${DB_PASSWORD:deokhugam1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create

    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.deokhugam: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace